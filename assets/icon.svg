<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <rect width="640" height="640" rx="140" fill="#1e6fe8"/>
  <!-- calendar rings -->
  <rect x="196" y="112" width="34" height="86" rx="17" fill="#ffffff"/>
  <rect x="410" y="112" width="34" height="86" rx="17" fill="#ffffff"/>
  <!-- calendar body -->
  <rect x="120" y="160" width="400" height="376" rx="56" fill="none" stroke="#ffffff" stroke-width="36"/>
  <!-- header divider -->
  <line x1="120" y1="266" x2="520" y2="266" stroke="#ffffff" stroke-width="36"/>
  <!-- grid cells: 3 columns x 2 rows, one filled as the "booked slot" -->
  <rect x="188" y="330" width="72" height="56" rx="16" fill="#ffffff" opacity="0.55"/>
  <rect x="284" y="330" width="72" height="56" rx="16" fill="#ffffff"/>
  <rect x="380" y="330" width="72" height="56" rx="16" fill="#ffffff" opacity="0.55"/>
  <rect x="188" y="422" width="72" height="56" rx="16" fill="#ffffff" opacity="0.55"/>
  <rect x="284" y="422" width="72" height="56" rx="16" fill="#ffffff" opacity="0.55"/>
  <rect x="380" y="422" width="72" height="56" rx="16" fill="#ffffff" opacity="0.55"/>
</svg>
